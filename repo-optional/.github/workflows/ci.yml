# Opcional por repo: CI en PRs para que el agente "quality" tenga checks que leer.
# Copia a .github/workflows/ci.yml y ajusta los pasos a tu stack (o usa .claude/verify.sh).
name: ci
on:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: ./.claude/verify.sh          # o tus comandos de lint/typecheck/test
  sonar:                                  # bórralo si el repo no usa SonarQube
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8.3.0   # fija el tag/sha que verifiques en el Marketplace
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}      # vacío en SonarQube Cloud
        with:
          args: -Dsonar.qualitygate.wait=true
